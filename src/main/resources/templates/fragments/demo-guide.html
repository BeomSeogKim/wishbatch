<section th:fragment="guide(guide)" class="shell notice notice-info demo-guide" aria-label="Demo guide">
    <span><strong>Demo guide</strong> · <span th:text="${guide.location}">Maker home</span></span>
    <a class="button button-secondary demo-guide-next" th:href="${guide.nextUrl}" th:text="${'Next: ' + guide.next}">Next: Review the options</a>
    <details class="demo-guide-more">
        <summary>More demo links</summary>
        <nav aria-label="More demo links">
            <a th:href="${guide.switchUrl}" th:text="${guide.switchLabel}">Switch view</a>
            <a th:if="${guide.explanationUrl != null}" th:href="@{${guide.explanationUrl}}">Batch explanation</a>
            <a th:if="${guide.decisionRecordUrl != null}" th:href="@{${guide.decisionRecordUrl}}">Decision record</a>
            <a th:if="${guide.decisionRecordUrl != null}" th:href="@{${guide.decisionRecordUrl + '.json'}}">Decision record JSON</a>
        </nav>
    </details>
</section>
