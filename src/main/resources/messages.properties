sandbox.notice=Sandbox demo. No real money moves.
pledge.AUTHORIZED=Hold placed. You have not been charged.
pledge.CAPTURED=Paid.
pledge.CAPTURE_PENDING=PayPal is still processing your payment.
pledge.CAPTURE_FAILED=Your payment could not be completed. You were not charged.
pledge.VOIDED=Hold released by PayPal. When the amount reappears depends on your bank or card.
pledge.REFUNDED=Refunded. When the money arrives depends on PayPal and your bank or card.
pledge.PARTIALLY_REFUNDED=Partial refund observed. Remaining amount is unconfirmed. Needs attention.
pledge.REFUND_PENDING=A refund has been requested. PayPal confirmation is not yet available.
money.term.1=Authorize a hold for the displayed amount now; no payment has been captured yet.
money.term.2=Payment can be captured only when authorized units meet the minimum before closing and the maker confirms production before the confirmation deadline.
money.term.3=If those conditions are not met, release of the hold is requested through PayPal. A request is not a confirmed release; when the hold disappears depends on PayPal and your bank or card.
money.term.4=If failed payments leave the batch below its minimum, refunds of completed payments are requested. A refund is not complete until PayPal confirms it; availability depends on PayPal and your bank or card.
money.term.5=A successful authorization does not ensure that payment capture will succeed.
money.term.6=The maker sets the delivery terms. This is a sandbox demo; no real money moves.
