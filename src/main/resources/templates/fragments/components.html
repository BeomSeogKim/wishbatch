<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<section th:fragment="counts(interest, authorized, paid, minimum)" class="counts" aria-label="Campaign counts">
    <div class="count count-interest">
        <p class="count-label">Stated interest</p>
        <p class="count-value" th:text="${interest}">48</p>
        <p class="count-caption">Compatible wishes. These are not orders.</p>
    </div>
    <div class="count count-authorized">
        <p class="count-label">Authorized holds</p>
        <p class="count-value" th:text="${authorized}">24</p>
        <p class="count-caption">Units with a payment hold. Not paid yet.</p>
        <progress class="progress-authorized" th:value="${authorized}" th:max="${minimum}" aria-label="Authorized units toward minimum batch">24 of 30</progress>
        <p class="count-target"><span th:text="${authorized}">24</span> / <span th:text="${minimum}">30</span> minimum units</p>
    </div>
    <div class="count count-paid">
        <p class="count-label">Paid</p>
        <p class="count-value" th:text="${paid}">0</p>
        <p class="count-caption">Units with completed payments.</p>
        <progress class="progress-paid" th:value="${paid}" th:max="${minimum}" aria-label="Paid units toward minimum batch">0 of 30</progress>
        <p class="count-target"><span th:text="${paid}">0</span> / <span th:text="${minimum}">30</span> minimum units</p>
    </div>
</section>
<ol th:fragment="steps(current)" class="step-rail" aria-label="Maker steps">
    <li th:each="label, step : ${ {'Options', 'Wishes', 'Proposal', 'Offer', 'Campaign', 'Settlement'} }"
        th:classappend="${step.count == current} ? 'is-current' : (${step.count < current} ? 'is-complete' : '')"
        th:attr="aria-current=${step.count == current ? 'step' : null}">
        <span class="step-number" th:text="${step.count}">1</span><span th:text="${label}">Options</span>
    </li>
</ol>
<figure th:fragment="evidence(quote, source, sourceUrl)" class="evidence">
    <span class="eyebrow">From a wish</span>
    <blockquote><p th:text="${quote}">A small print for my desk would be lovely.</p></blockquote>
    <figcaption><a th:href="${sourceUrl}" th:text="${source}">View source wish</a></figcaption>
</figure>
<section th:fragment="moneyTerms" class="money-terms" aria-label="Payment terms">
    <h2 class="h3">Before you authorize</h2>
    <ol><li th:each="number : ${#numbers.sequence(1, 6)}" th:text="#{${'money.term.' + number}}">Payment term</li></ol>
</section>
</body>
</html>
