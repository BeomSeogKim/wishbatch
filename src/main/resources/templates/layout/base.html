<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:fragment="page(title, content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title th:text="${title} + ' | ' + ${productName}">Wishbatch</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}">
    <link rel="stylesheet" th:href="@{/css/product.css}">
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
<header class="site-header shell">
    <a class="wordmark" th:href="@{/}" aria-label="Home">
        <svg class="brand-mark" viewBox="0 0 32 32" fill="none" aria-hidden="true">
            <rect x="2" y="2" width="12" height="12" rx="4" fill="currentColor"/>
            <rect x="18" y="2" width="12" height="12" rx="4" fill="currentColor" opacity=".45"/>
            <rect x="2" y="18" width="12" height="12" rx="4" fill="currentColor" opacity=".45"/>
            <path d="m19 24 4 4 7-9" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span th:text="${productName}">Wishbatch</span>
    </a>
    <nav class="header-links" aria-label="Main navigation">
        <a th:href="@{/#how-it-works}">How it works</a>
        <a th:href="@{/#testing}">Testing guide</a>
    </nav>
</header>
<div class="sandbox-notice"><span class="sandbox-dot" aria-hidden="true"></span><span th:text="#{sandbox.notice}">Sandbox demo. No real money moves.</span></div>
<main th:replace="${content}"></main>
<footer class="site-footer shell">
    <div><strong th:text="${productName}">Wishbatch</strong><span> A little clarity before you create.</span></div>
    <nav aria-label="Footer navigation"><a th:href="@{/styleguide}">Design system</a><a th:href="@{/#testing}">Testing guide</a></nav>
</footer>
</body>
</html>
