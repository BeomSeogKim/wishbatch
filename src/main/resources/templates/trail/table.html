<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<section th:fragment="table(entries)" aria-label="Money trail" data-money-trail>
    <h2>Recorded payment checkpoints</h2>
    <p th:if="${#lists.isEmpty(entries)}">No payment checkpoints recorded.</p>
    <table th:unless="${#lists.isEmpty(entries)}">
        <thead><tr><th>Pledge ID</th><th>Checkpoint time (UTC)</th><th>Status</th><th>Provider ID</th><th>Amount</th></tr></thead>
        <tbody><tr th:each="entry : ${entries}"><td th:text="${entry.pledgeId}"></td><td th:text="${entry.checkpoint}"></td><td th:text="${entry.status}"></td><td th:text="${entry.providerId ?: 'Unknown'}"></td><td th:text="${entry.amount}"></td></tr></tbody>
    </table>
</section>
</body>
</html>
