<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<section th:fragment="why(evidence)" class="card" aria-labelledby="offer-evidence-title">
    <h2 id="offer-evidence-title">Why this offer</h2>
    <p class="offer-interest"><strong>Compatible wishes: <span th:text="${evidence.compatibleWishCount}"></span></strong> — stated interest, not orders.</p>
    <p>AI grouped the wishes; the maker chose and confirmed this offer.</p>
    <div class="offer-evidence-quotes">
        <figure th:each="quote : ${evidence.quotes}" class="evidence">
            <span class="eyebrow">From a wish</span>
            <blockquote><p th:text="${quote.quote}"></p></blockquote>
            <figcaption>Anonymous fan</figcaption>
        </figure>
    </div>
</section>
</body>
</html>
