name: Keep warm

on:
  workflow_dispatch:
  schedule:
    - cron: '3,13,23,33,43,53 * * * *'

permissions:
  contents: read

concurrency:
  group: keep-warm
  cancel-in-progress: true

jobs:
  landing-page:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Request the hosted landing page
        run: curl --fail --silent --show-error --connect-timeout 10 --max-time 300 --output /dev/null https://wishbatch.onrender.com/
